<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#010E3B">
  <title>Song Requests | Go Event DJ</title>
  <link rel="icon" href="/static/images/favicon-96x96.png">
  <link rel="stylesheet" href="/static/style.css?v=navy-v4">
  <script defer src="/static/vendor/lottie_light.min.js"></script>
  <script defer src="/static/brand.js?v=brand2"></script>
  <script defer src="/static/icons.js?v=1"></script>
  <script defer src="/static/guest.js?v=navy-v4"></script>
</head>
<body>
<main class="shell narrow guest-board">
<div class="top"><a href="/requests" class="brand brand-lockup"><span class="brand-logo-frame"><img class="brand-logo" src="/static/images/go-event-dj-logo.svg?v=white" alt="Go Event DJ" width="451" height="161"><span class="brand-animation" aria-hidden="true"></span></span><small>THE SOUNDTRACK TO YOUR EVENT</small></a><nav><a href="/admin">DJ login</a></nav></div>
  <div id="flash" class="hidden" role="status" aria-live="polite"></div>
  <div id="loading" class="panel">Loading event requests…</div>
  <div id="board" class="hidden stack">
    <header class="panel hero">
      <div class="row wrap"><span class="badge" id="state"></span><span class="muted small" id="presence"></span></div>
      <h1 id="event-name" class="space-top">Song requests</h1>
      <p class="muted small" id="intro"></p>
      <div class="vibe hidden" id="vibe"><h2 id="vibe-title">Today's music vibe</h2><div class="genre-tags" id="genres"></div></div>
    </header>
    <section id="entry" class="panel hidden">
      <h2>Request a song</h2>
      <form id="request-form" class="stack">
        <div class="song-picker">
          <div id="catalog-entry" class="stack">
            <div class="field"><label for="lookup">Song or artist</label><input type="search" id="lookup" maxlength="120" autocomplete="off" placeholder="Search by song or artist"></div>
            <div id="search-hint" class="muted small" role="status"></div>
          </div>
          <div id="manual-entry" class="hidden grid two">
            <div class="field"><label for="title">Song title</label><input id="title" maxlength="120" autocomplete="off"></div>
            <div class="field"><label for="artist">Artist</label><input id="artist" maxlength="120" autocomplete="off"></div>
          </div>
          <div class="result-panel">
            <div id="suggestions"></div>
            <div class="hidden" id="selection"></div>
            <button type="button" class="text-action" id="manual-toggle"><svg class="link-icon" aria-hidden="true"><use href="/static/images/guest-link-icons.svg?v=2#plus-circle"></use></svg><span>Enter request manually</span></button>
          </div>
        </div>
        <div class="field"><label for="requester">Your name <span>(optional)</span></label><input id="requester" maxlength="80" autocomplete="given-name" placeholder="Your name"></div>
        <div class="field"><label for="note">Dedication or special note <span>(optional)</span></label><textarea id="note" maxlength="240" rows="2" placeholder="A message for the DJ"></textarea></div>
        <div class="hidden"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
        <button class="btn primary full" id="submit-btn" disabled>Send Song Request</button>
      </form>
    </section>
    <section id="queue" class="panel hidden">
      <div class="section-title"><h2>Guest requests</h2><span class="muted small" id="request-count"></span></div>
      <div class="tabbar queue-tabs" aria-label="Filter guest requests">
        <button class="btn small active" type="button" data-filter="pending" aria-pressed="true">Pending</button>
        <button class="btn small" type="button" data-filter="accepted" aria-pressed="false">Accepted</button>
        <button class="btn small" type="button" data-filter="played" aria-pressed="false">Played</button>
      </div>
      <input type="search" id="search" class="find" aria-label="Filter guest requests by song or artist" placeholder="Find a request">
      <div id="requests-list"></div>
    </section>
    <section class="panel hidden" id="external-links"><h2>Enjoying the experience?</h2>
      <p class="muted connection-copy">Bring Go Event DJ to your next celebration.</p>
      <div class="tiprow" id="guest-link-buttons"></div>
      <div id="social-links" class="hidden"><h3>Connect with us</h3><div class="tiprow" id="custom-link-buttons"></div></div></section>
  </div>
  <footer class="footer">GO EVENT DJ · Music requests subject to DJ discretion</footer>
</main>
</body>
</html>
