<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color">
  <title>Song Requests | Go Event DJ</title>
  <link rel="icon" href="/static/images/favicon-96x96.png">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/vendor/lottie_light.min.js"></script>
  <script defer src="/static/brand.js"></script>
  <script defer src="/static/icons.js"></script>
  <script defer src="/static/tracks.js"></script>
  <script defer src="/static/guest.js"></script>
</head>
<body>
<main class="shell narrow guest-board">
  <header class="top">
    <a href="/requests" class="brand brand-lockup">
      <span class="brand-logo-frame">
        <img class="brand-logo" src="/static/images/go-event-dj-logo.svg?v=white" alt="Go Event DJ" width="451" height="161">
        <span class="brand-animation" aria-hidden="true"></span>
      </span>
    </a>
    <div class="guest-top-tools">
      <span id="presence" class="presence hidden"><svg class="link-icon" aria-hidden="true"><use href="/static/images/guest-link-icons.svg?v=3#guests"></use></svg><span id="presence-count"></span></span>
      <nav><a href="/admin">DJ Login</a></nav>
    </div>
  </header>
  <div id="flash" class="hidden" role="status" aria-live="polite"></div>
  <p id="loading" class="muted small">Loading event requests…</p>
  <div id="board" class="hidden stack">
    <section class="panel entry-panel" aria-labelledby="entry-heading">
      <p class="event-context hidden" id="event-name"></p>
      <h1 id="entry-heading">Request a Song</h1>
      <p id="closed-message" class="muted small hidden"></p>
      <form id="entry" class="stack hidden">
        <div id="catalog-entry" class="song-picker">
          <div class="floating-field">
            <input type="search" id="lookup" maxlength="120" autocomplete="off" placeholder=" ">
            <label for="lookup">Search by Song or Artist</label>
          </div>
          <p id="search-hint" class="search-hint muted small" role="status"></p>
          <div id="suggestions" class="suggestions"></div>
        </div>
        <div id="song-details" class="stack hidden">
          <div class="selected-song">
            <div id="selection" tabindex="-1"></div>
            <button type="button" id="change-song" class="change-song">Change Song</button>
          </div>
          <div class="floating-field">
            <input id="requester" maxlength="80" autocomplete="given-name" placeholder=" ">
            <label for="requester">Your Name (Optional)</label>
          </div>
          <div class="floating-field">
            <textarea id="note" maxlength="240" rows="2" placeholder=" "></textarea>
            <label for="note">Dedication or Special Note (Optional)</label>
          </div>
          <button class="btn primary full" id="submit-btn" disabled>Send Request</button>
        </div>
        <div class="hidden"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
      </form>
    </section>
    <section id="queue" class="panel request-panel hidden" aria-label="Song Queue">
      <div class="queue-tabs" role="group" aria-label="Show Songs">
        <button type="button" data-filter="queue" aria-pressed="true">In the Queue</button>
        <button type="button" data-filter="played" aria-pressed="false">Played</button>
      </div>
      <div id="requests-list"></div>
    </section>
    <section class="panel connection-panel hidden" id="external-links" aria-label="Go Event DJ Links">
      <div id="booking-link" class="booking-link"></div>
      <div class="tiprow" id="guest-link-buttons"></div>
      <div id="social-links" class="social-links hidden"><h3>Connect With Us</h3><div class="social-row" id="custom-link-buttons"></div></div>
    </section>
  </div>
  <footer class="footer">Go Event DJ · Music requests subject to DJ discretion</footer>
</main>
</body>
</html>
